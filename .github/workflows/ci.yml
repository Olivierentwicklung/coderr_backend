name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: django-insecure-ci-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint
        run: pylint manage.py core users_auth_app uploads_app reviews_app offers_app orders_app base_info_app

      - name: Run tests with coverage
        run: pytest --cov=. --cov-fail-under=98

      - name: Build Docker image
        run: docker build -t django-app:test .
